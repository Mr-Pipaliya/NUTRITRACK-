<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — NutriTrack+</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .cart-item { display: flex; gap: 16px; padding: 16px; border-bottom: 1px solid var(--border); }
    .cart-item:last-child { border-bottom: none; }
    .cart-img { width: 80px; height: 80px; border-radius: var(--r-md); object-fit: cover; background: var(--surface); }
    .cart-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .cart-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .cart-price { font-size: 14px; font-weight: 900; color: var(--primary); }
    
    .qty-controls { display: flex; align-items: center; gap: 12px; }
    .qty-btn { width: 28px; height: 28px; border-radius: 8px; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text); font-weight: 700; transition: 0.2s; }
    .qty-btn:hover { background: var(--surface2); }
    .qty-val { font-size: 14px; font-weight: 700; width: 16px; text-align: center; }
    
    .cart-del { color: var(--text3); font-size: 18px; padding: 4px; transition: 0.2s; }
    .cart-del:hover { color: var(--danger); }
    
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
    .summary-total { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); font-size: 18px; font-weight: 900; color: var(--primary); }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="navbar">
    <div class="container" style="max-width: 800px;">
      <a href="dashboard.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px;">
        <div class="logo-icon"><i class="fas fa-leaf"></i></div>
        <span class="logo-text" style="font-size: 16px;">NutriTrack+</span>
      </a>
      <div class="nav-links">
        <a href="dashboard.html"><i class="fas fa-home"></i><span class="nav-text">Home</span></a>
        <a href="food.html"><i class="fas fa-book-open"></i><span class="nav-text">Food</span></a>
        <a href="routine.html"><i class="fas fa-check-square"></i><span class="nav-text">Routine</span></a>
        <a href="about.html"><i class="fas fa-info-circle"></i><span class="nav-text">About</span></a>
        <a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i><span class="nav-text">Cart</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span class="nav-text">Profile</span></a>
      </div>
    </div>
  </nav>

  <main class="app-container">
    <header class="page-header" style="margin-bottom: 16px;">
      <div>
        <h1>Your Cart</h1>
        <p>Review items before checkout</p>
      </div>
    </header>

    <div class="card" style="padding: 0; overflow: hidden; margin-bottom: 24px;">
      <div id="cartList">
        <div style="text-align: center; padding: 40px; color: var(--text3);">
          <i class="fas fa-shopping-cart fa-2x" style="opacity: 0.5; margin-bottom: 12px;"></i>
          <p>Your cart is empty.</p>
          <a href="food.html" class="btn btn-outline" style="margin-top: 16px;">Browse Store</a>
        </div>
      </div>
    </div>

    <div id="cartSummary" class="card hide">
      <h3 class="card-title">Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
      <div class="summary-row"><span>Delivery</span><span id="deliveryFee">₹50</span></div>
      <div class="summary-total"><span>Total</span><span id="totalAmount">₹0</span></div>
      
      <a href="checkout.html" class="btn btn-primary btn-full" style="margin-top: 24px; padding: 16px;">
        Proceed to Checkout <i class="fas fa-arrow-right"></i>
      </a>
    </div>
  </main>



  <script src="js/local-db.js"></script>
  <script src="js/script.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
