<style>
.food-section-title {
  font-size:18px; font-weight:800; margin:24px 0 14px;
  letter-spacing:-0.3px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  display:inline-block;
}
.no-results { text-align:center; padding:50px 20px; color:var(--text3); }
.no-results .no-icon { font-size:48px; margin-bottom:10px; }

/* Image fallback */
.food-card-img-wrap { position:relative; overflow:hidden; height:155px; }
.food-card-img { width:100%; height:100%; object-fit:cover; transition:transform 0.4s ease; }
.food-card:hover .food-card-img { transform:scale(1.06); }
.img-placeholder {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,rgba(0,245,160,0.08),rgba(0,212,255,0.06));
  font-size:52px;
}
</style>

<!-- FOOD DETAIL MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" style="position:relative">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalImgWrap" style="width:100%;height:180px;border-radius:16px;overflow:hidden;margin-bottom:18px;background:var(--surface2)">
      <img id="modalImg" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<div style=height:100%;display:flex;align-items:center;justify-content:center;font-size:64px>🍽</div>'">
    </div>
    <div class="modal-title" id="modalName"></div>
    <span class="badge badge-green" id="modalPrice" style="margin-bottom:16px;display:inline-flex"></span>

    <div class="modal-row"><span class="modal-row-label">🌿 Ingredients</span><span class="modal-row-value" id="modalIng"></span></div>
    <div class="modal-row"><span class="modal-row-label">⚖ Ratio</span><span class="modal-row-value" id="modalRatio"></span></div>
    <div class="modal-row"><span class="modal-row-label">⏱ Fermentation</span><span class="modal-row-value" id="modalTime"></span></div>
    <div class="modal-row"><span class="modal-row-label">🔬 Microorganism</span><span class="modal-row-value" id="modalMicro"></span></div>

    <button class="btn btn-primary btn-full" style="margin-top:20px" onclick="orderFood()">🛒 Add to Cart</button>
  </div>
</div>

<main class="page">
  <div class="page-header">
    <h1 class="page-title">Food Explorer 🌿</h1>
    <p class="page-subtitle">Discover fermented foods from around the world</p>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="search" class="input" placeholder="Search fermented foods…" oninput="render()">
  </div>

  <!-- CATEGORY TABS -->
  <div class="cat-tabs">
    <div class="cat-tab active" onclick="setFilter('all',this)">All</div>
    <div class="cat-tab" onclick="setFilter('indian',this)">🇮🇳 Indian</div>
    <div class="cat-tab" onclick="setFilter('international',this)">🌍 International</div>
    <div class="cat-tab" onclick="setFilter('sweets',this)">🍬 Sweets & Beverages</div>
  </div>

  <div id="foodList"></div>
</main>

<script src="app.js"></script>
<script>
const foods = {
  indian: [
    {name:"Pickle",ing:"Vegetables, water, salt",ratio:"1kg : 2–4L : 2–3%",time:"5–10 days",micro:"Lactobacillus",price:80,img:"images/pickle.webp",emoji:"🥒"},
    {name:"Curd",ing:"Milk, starter",ratio:"1L : 1 tbsp",time:"6–8 hours",micro:"L. bulgaricus",price:40,img:"images/Curd.jpg",emoji:"🥛"},
    {name:"Idli",ing:"Rice, urad dal",ratio:"2 : 1",time:"8–12 hours",micro:"Leuconostoc",price:60,img:"images/Idli.webp",emoji:"🍚"},
    {name:"Dosa",ing:"Rice, urad dal",ratio:"3 : 1",time:"8–14 hours",micro:"Pediococcus",price:70,img:"images/Dosa.jpg",emoji:"🫓"},
    {name:"Appam",ing:"Rice, coconut",ratio:"2 : 1",time:"8–12 hours",micro:"Saccharomyces",price:65,img:"images/Appam.jfif",emoji:"🥞"},
    {name:"Dhokla",ing:"Besan, curd",ratio:"1 : 0.5",time:"6–10 hours",micro:"L. fermentum",price:55,img:"images/Dhokla.jpg",emoji:"🧆"},
    {name:"Panta Bhaat",ing:"Rice, water",ratio:"1 : 2",time:"8–12 hours",micro:"L. plantarum",price:45,img:"images/Panta Bhaat.webp",emoji:"🍚"},
    {name:"Bhatura",ing:"Maida, curd",ratio:"2 : 1",time:"4–6 hours",micro:"Saccharomyces",price:50,img:"images/Bhatura.jpg",emoji:"🥙"},
    {name:"Kulcha",ing:"Maida, curd",ratio:"2 : 0.5",time:"4–8 hours",micro:"Saccharomyces",price:55,img:"images/Kulcha.jpg",emoji:"🫓"},
    {name:"Kanji Vada",ing:"Urad dal, mustard",ratio:"1 : 0.1",time:"24–48 hours",micro:"Lactobacillus",price:90,img:"images/Kanji Vada.jpg",emoji:"🍲"},
    {name:"Mesu - Khorisa",ing:"Bamboo shoots",ratio:"Submerged",time:"7–15 days",micro:"L. plantarum",price:120,img:"images/Mesu - Khorisa.webp",emoji:"🌿"},
    {name:"Kaladi Cheese",ing:"Milk",ratio:"10 : 1",time:"12–24 hours",micro:"Lactococcus",price:150,img:"images/Kaladi Cheese.jfif",emoji:"🧀"},
    {name:"Gundruk",ing:"Leafy greens, salt",ratio:"10 : 0.2",time:"7–14 days",micro:"L. brevis",price:100,img:"images/Gundruk.JPG",emoji:"🥬"},
  ],
  international: [
    {name:"Kimchi",ing:"Napa cabbage, salt",ratio:"10 : 0.2",time:"3–7 days",micro:"L. plantarum",price:180,img:"images/Kimchi.jpg",emoji:"🥬"},
    {name:"Sauerkraut",ing:"Cabbage, salt",ratio:"10 : 0.2",time:"7–21 days",micro:"Lactobacillus",price:160,img:"images/Sauerkraut.jpg",emoji:"🥗"},
    {name:"Miso",ing:"Soybeans, koji, salt",ratio:"2 : 1 : 0.2",time:"6 months–2 years",micro:"Aspergillus oryzae",price:220,img:"images/Miso.jpg",emoji:"🍜"},
    {name:"Fermented Tofu (Furu)",ing:"Tofu, salt, rice wine",ratio:"5 : 0.5 : 1",time:"2–6 months",micro:"Actinomucor",price:200,img:"images/Fermented Tofu (Furu).jpg",emoji:"🟫"},
    {name:"Tepache",ing:"Pineapple peel, sugar",ratio:"1 : 0.2 : 3",time:"2–5 days",micro:"Saccharomyces",price:140,img:"images/Tepache.webp",emoji:"🍍"},
    {name:"Boza",ing:"Cereal grains, sugar",ratio:"1 : 0.2 : 5",time:"2–3 days",micro:"Lactobacillus",price:150,img:"images/Boza.webp",emoji:"🥤"},
    {name:"Milk Kefir",ing:"Milk, kefir grains",ratio:"10 : 1",time:"18–24 hours",micro:"L. kefiri",price:170,img:"images/Milk Kefir.webp",emoji:"🥛"},
    {name:"Tibicos (Water Kefir)",ing:"Water, sugar, grains",ratio:"10 : 1 : 1",time:"24–48 hours",micro:"L. hilgardii",price:160,img:"images/Tibicos (Water Kefir).jpg",emoji:"💧"},
  ],
  sweets: [
    {name:"Jalebi",ing:"Maida, curd, water",ratio:"1 : 1.5 : as required",time:"8–12 hours",micro:"L. fermentum",price:90,img:"images/Jalebi.jpg",emoji:"🍩"},
    {name:"Mishti Doi",ing:"Milk, sugar, starter curd",ratio:"1L : 3–4 tbsp : 1 tbsp",time:"8–10 hours",micro:"L. bulgaricus",price:120,img:"images/Mishti Doi.webp",emoji:"🍮"},
    {name:"Ambali",ing:"Ragi flour, water",ratio:"1 tbsp : 1 cup",time:"8–12 hours",micro:"L. plantarum",price:60,img:"images/Ambali.jpg",emoji:"🥣"},
    {name:"Kanji",ing:"Black carrot, water, salt",ratio:"1 cup : 4 cups : 1 tsp",time:"2–3 days",micro:"L. plantarum",price:70,img:"images/Kanji.jpg",emoji:"🟣"},
    {name:"Kombucha",ing:"Tea, sugar, SCOBY",ratio:"1L : 2 tbsp : 1 SCOBY",time:"7–10 days",micro:"Acetobacter xylinum",price:150,img:"images/Kombucha.jfif",emoji:"🍵"},
    {name:"Bombucha (Jun)",ing:"Green tea, honey, SCOBY",ratio:"1L : 2 tbsp : 1 SCOBY",time:"4–7 days",micro:"Komagataeibacter xylinus",price:170,img:"images/Bombucha (Jun).webp",emoji:"🍵"},
    {name:"Ginger Bug",ing:"Ginger, sugar, water",ratio:"1 cup : 1 tbsp : 1 tbsp",time:"3–5 days",micro:"Saccharomyces cerevisiae",price:80,img:"images/Ginger Bug.jpg",emoji:"🫚"},
    {name:"Alcoholic Beverages",ing:"Fruit/grain substrate, yeast",ratio:"1L : 100–200g : 0.25 tsp",time:"5–14 days",micro:"Saccharomyces cerevisiae",price:250,img:"images/Alcoholic Beverages.jpg",emoji:"🍺"},
  ]
};

let selectedFood = null;
let activeFilter = "all";

function setFilter(f, tab) {
  activeFilter = f;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  render();
}

function render() {
  const q   = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("foodList");

  const sections = activeFilter === "all"
    ? [{ label:"🇮🇳 Indian Fermented Foods", key:"indian" },
       { label:"🌍 International Fermented Foods", key:"international" },
       { label:"🍬 Sweets & Beverages", key:"sweets" }]
    : [{ label: activeFilter === "indian" ? "🇮🇳 Indian" : activeFilter === "international" ? "🌍 International" : "🍬 Sweets & Beverages", key: activeFilter }];

  let html = "";
  let total = 0;
  sections.forEach(sec => {
    const filtered = foods[sec.key].filter(f => f.name.toLowerCase().includes(q));
    total += filtered.length;
    if (!filtered.length) return;
    html += `<div class="food-section-title">${sec.label}</div>`;
    html += `<div class="food-grid">`;
    html += filtered.map((f, i) => `
      <div class="food-card" style="animation-delay:${i*0.04}s" onclick='openModal(${JSON.stringify(f)})'>
        <div class="food-card-img-wrap">
          <img class="food-card-img" src="${f.img}" alt="${f.name}"
            onerror="this.style.display='none';this.nextSibling.style.display='flex'">
          <div class="img-placeholder" style="display:none">${f.emoji}</div>
        </div>
        <div class="food-card-body">
          <div class="food-card-name">${f.name}</div>
          <div class="food-card-meta">
            <span>⏱ ${f.time}</span>
            <span class="food-card-price">₹${f.price}</span>
          </div>
        </div>
      </div>`).join("");
    html += `</div>`;
  });

  if (!total) {
    html = `<div class="no-results"><div class="no-icon">🔍</div><p>No results for "<b>${q}</b>"</p></div>`;
  }

  list.innerHTML = html;
  initTilt('.food-card');
}

function openModal(f) {
  selectedFood = f;
  document.getElementById("modal").classList.add("open");
  document.getElementById("modalName").textContent  = f.name;
  document.getElementById("modalPrice").textContent = "₹" + f.price;
  document.getElementById("modalImg").src           = f.img;
  document.getElementById("modalIng").textContent   = f.ing;
  document.getElementById("modalRatio").textContent = f.ratio;
  document.getElementById("modalTime").textContent  = f.time;
  document.getElementById("modalMicro").textContent = f.micro;
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }

function orderFood() {
  if (!selectedFood) return;
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({ name: selectedFood.name, price: selectedFood.price });
  localStorage.setItem("cart", JSON.stringify(cart));
  closeModal();
  toast(`${selectedFood.name} added to cart 🛒`, "ok");
}

render();
</script>
</body>
</html>
