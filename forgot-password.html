<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NutriTrack+</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; position: relative; overflow: hidden; }
    .auth-bg { position: absolute; inset: 0; z-index: -1; }
    .auth-orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.15; }
    .auth-card {
      width: 100%; max-width: 420px; background: rgba(var(--bg2-rgb), 0.8);
      backdrop-filter: blur(24px); border: 1px solid var(--border);
      border-radius: var(--r-xl); padding: 40px; box-shadow: var(--shadow);
      animation: fadeSlideUp 0.5s ease;
    }
    .auth-header { text-align: center; margin-bottom: 32px; }
    .auth-logo {
      width: 64px; height: 64px; border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #070E1F; font-size: 32px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; box-shadow: 0 8px 24px var(--primary-glow);
    }
    .auth-title { font-size: 28px; font-weight: 900; }
    .auth-subtitle { font-size: 14px; color: var(--text3); margin-top: 8px; }
    
    .error-msg { background: rgba(255, 77, 109, 0.1); color: var(--danger); padding: 12px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; margin-bottom: 20px; display: none; }
    .success-msg { background: rgba(0, 245, 160, 0.1); color: var(--primary); padding: 12px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-bg">
      <div class="auth-orb" style="width: 400px; height: 400px; top: -100px; left: -100px; background: var(--primary);"></div>
      <div class="auth-orb" style="width: 300px; height: 300px; bottom: -50px; right: -50px; background: var(--secondary);"></div>
    </div>
    
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo"><i class="fas fa-lock"></i></div>
        <h1 class="auth-title text-gradient">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and new password</p>
      </div>
      
      <div id="resetError" class="error-msg"><i class="fas fa-exclamation-circle"></i> <span id="resetErrorText"></span></div>
      <div id="resetSuccess" class="success-msg"><i class="fas fa-check-circle"></i> <span id="resetSuccessText"></span></div>
      
      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <i class="fas fa-envelope form-icon"></i>
          <input type="email" id="email" class="form-input has-icon" placeholder="hardik@gmail.com" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <i class="fas fa-key form-icon"></i>
          <input type="password" id="newPassword" class="form-input has-icon" placeholder="Min. 6 characters" minlength="6" required>
        </div>
        
        <button type="submit" id="resetBtn" class="btn btn-primary btn-full"><i class="fas fa-sync-alt"></i> Update Password</button>
      </form>
      
      <p style="text-align: center; margin-top: 32px; font-size: 13px; color: var(--text3);">
        Remembered your password? <a href="login.html" class="text-gradient" style="font-weight: 700;">Log In</a>
      </p>
    </div>
  </div>

  <script src="js/local-db.js"></script>
  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('resetForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.toLowerCase();
        const newPassword = document.getElementById('newPassword').value;
        const errorDiv = document.getElementById('resetError');
        const successDiv = document.getElementById('resetSuccess');
        
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        
        const users = LocalDB.getUsers();
        
        if (users[email]) {
          users[email].password = newPassword;
          LocalDB.saveUsers(users);
          successDiv.style.display = 'block';
          document.getElementById('resetSuccessText').textContent = 'Password updated successfully! Redirecting to login...';
          setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
          errorDiv.style.display = 'block';
          document.getElementById('resetErrorText').textContent = 'No account found with this email.';
        }
      });
    });
  </script>
</body>
</html>
