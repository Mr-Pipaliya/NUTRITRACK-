<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — NutriTrack+</title>
<meta name="description" content="Sign in to NutriTrack+ and start tracking your nutrition journey.">
<link rel="stylesheet" href="styles.css">
<style>
body { padding:0; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }

/* Floating orbs */
.orb {
  position:fixed; border-radius:50%; filter:blur(80px);
  pointer-events:none; z-index:0; animation:orbFloat 8s ease-in-out infinite;
}
.orb-1 { width:350px; height:350px; background:rgba(0,245,160,0.07); top:-80px; left:-80px; }
.orb-2 { width:280px; height:280px; background:rgba(0,212,255,0.06); bottom:-60px; right:-60px; animation-delay:3s; animation-direction:reverse; }
@keyframes orbFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-30px) scale(1.05)} }

/* Particle canvas */
#particles { position:fixed; inset:0; z-index:0; pointer-events:none; }

.login-wrap { position:relative; z-index:1; width:100%; max-width:420px; padding:20px; animation:fadeSlideUp 0.5s ease; }

.login-card {
  background:rgba(7,14,31,0.9);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:28px; padding:38px 32px;
  backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
  box-shadow:0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset;
}

.login-logo { text-align:center; margin-bottom:30px; }
.logo-name {
  font-size:34px; font-weight:900; letter-spacing:-1.5px; line-height:1;
  background:linear-gradient(135deg,#00f5a0,#00d4ff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.logo-plus { font-size:24px; opacity:0.5; }
.logo-sub  { font-size:13px; color:#8b9ab5; margin-top:6px; }

.error-banner {
  background:rgba(255,77,109,0.1); border:1px solid rgba(255,77,109,0.28);
  border-radius:12px; padding:11px 16px; font-size:13px; color:#ff4d6d;
  margin-bottom:14px; display:none;
}

.forgot-link {
  display:block; text-align:right; font-size:12px; font-weight:500;
  color:#8b9ab5; margin-top:8px; cursor:pointer; transition:color 0.2s;
}
.forgot-link:hover { color:#00f5a0; }

.login-footer { text-align:center; margin-top:22px; font-size:12px; color:#4a5a72; }

@keyframes shakeX {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)} 40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<canvas id="particles"></canvas>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-name">NUTRITRACK<span class="logo-plus">+</span></div>
      <div class="logo-sub">Sign in to your dashboard</div>
    </div>

    <div class="error-banner" id="errorBanner">⚠ Invalid email or password. Try again.</div>

    <div class="input-group">
      <label class="input-label">Email Address</label>
      <input id="email" type="email" class="input" placeholder="hardik@gmail.com" autocomplete="email">
    </div>

    <div class="input-group">
      <label class="input-label">Password</label>
      <div class="input-wrap">
        <input id="password" type="password" class="input" placeholder="••••••••" style="padding-right:48px" autocomplete="current-password">
        <span class="input-icon" id="eyeBtn" onclick="togglePass()">👁</span>
      </div>
      <span class="forgot-link" onclick="forgot()">Forgot password?</span>
    </div>

    <button class="btn btn-primary btn-full" id="loginBtn" onclick="login()" style="margin-top:10px">
      Sign In →
    </button>

    <div class="login-footer">© 2026 NutriTrack+ · All rights reserved</div>
  </div>
</div>

<script src="app.js"></script>
<script>
/* ── Particle Canvas ── */
(function() {
  const cv = document.getElementById('particles');
  const ctx = cv.getContext('2d');
  let W, H, particles;

  function resize() {
    W = cv.width  = innerWidth;
    H = cv.height = innerHeight;
  }

  function makeParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.5,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -Math.random() * 0.6 - 0.2,
      op: Math.random() * 0.5 + 0.1,
      col: Math.random() > 0.5 ? '#00f5a0' : '#00d4ff',
    };
  }

  resize();
  particles = Array.from({length: 60}, makeParticle);
  window.addEventListener('resize', resize);

  (function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -4) { Object.assign(p, makeParticle(), {y: H + 4}); }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.col;
      ctx.globalAlpha = p.op;
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();

/* ── Auth Logic ── */
const FIXED_EMAIL  = "hardik@gmail.com";
const DEFAULT_PASS = "123456";

if (!localStorage.getItem("userPass"))  localStorage.setItem("userPass", DEFAULT_PASS);
if (localStorage.getItem("loggedIn") === "true") window.location.href = "index.html";

function togglePass() {
  const p = document.getElementById("password");
  const b = document.getElementById("eyeBtn");
  p.type = p.type === "password" ? "text" : "password";
  b.textContent = p.type === "password" ? "👁" : "🙈";
}

function login() {
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("password").value;
  const err   = document.getElementById("errorBanner");
  if (email === FIXED_EMAIL && pass === localStorage.getItem("userPass")) {
    localStorage.setItem("loggedIn", "true");
    toast("Welcome back! 🎉", "ok");
    document.getElementById("loginBtn").textContent = "✓ Signing in…";
    setTimeout(() => window.location.href = "index.html", 900);
  } else {
    err.style.display = "block";
    err.style.animation = "none";
    err.getBoundingClientRect();
    err.style.animation = "shakeX 0.45s ease";
  }
}

function forgot() {
  const em = prompt("Enter your registered email:");
  if (em !== FIXED_EMAIL) { toast("Email not found", "err"); return; }
  const np = prompt("Set new password (min 4 chars):");
  if (np && np.length >= 4) {
    localStorage.setItem("userPass", np);
    toast("Password updated ✓", "ok");
  } else {
    toast("Password must be at least 4 characters", "warn");
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
