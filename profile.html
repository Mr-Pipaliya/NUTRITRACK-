<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | NutriTrack+</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #10b981;
  --primary-dark: #0d8f6a;
  --dark: #020617;
  --card: rgba(30,41,59,0.85);
  --glass: rgba(255,255,255,0.08);
  --text: #f8fafc;
  --dim: #94a3b8;
  --shadow: rgba(0,0,0,0.45);
  --hover-glow: rgba(16,185,129,0.25);
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Plus Jakarta Sans',sans-serif;
}

body{
  background:radial-gradient(circle at top,var(--dark),var(--dark) 60%);
  color:var(--text);
  padding:100px 20px 20px;
  min-height:100vh;
}

/* HEADER */
.header{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:100;
  flex-wrap:wrap;
}

.header h1{
  font-size:24px;
  font-weight:700;
}

.nav-right{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:5px;
}

.nav-btn{
  padding:8px 14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  color:var(--dim);
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(6px);
  transition:.25s;
  font-size:14px;
}

.nav-btn:hover{
  background:var(--glass);
  color:#fff;
  transform:translateY(-1px);
  box-shadow:0 4px 12px var(--hover-glow);
}

.nav-btn.active{
  background:linear-gradient(90deg,var(--primary),var(--primary-dark));
  color:#fff;
  box-shadow:0 4px 12px var(--hover-glow);
}

.nav-btn.logout{
  background:rgba(239,68,68,.15);
  color:#fecaca;
}

.nav-btn.logout:hover{
  background:rgba(239,68,68,.35);
  color:#fff;
}

/* CARD */
.card{
  background:var(--card);
  backdrop-filter:blur(18px);
  padding:22px;
  border-radius:22px;
  max-width:500px;
  margin:20px auto;
  box-shadow:0 15px 35px var(--shadow);
}

.card h3{
  margin-bottom:12px;
  font-size:18px;
}

/* FORM */
label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
}

input,select{
  width:100%;
  padding:12px 14px;
  border-radius:14px;
  border:none;
  margin-bottom:16px;
  background:var(--glass);
  color:var(--text);
  outline:none;
  font-size:14px;
}

/* BUTTONS */
button, input{
  padding:10px 14px;
  font-size:14px;
}

.btn{
  width:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary-dark));
  border:none;
  padding:12px;
  border-radius:14px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 4px 16px var(--hover-glow);
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.1);
}

.small{
  color:var(--dim);
  font-size:12px;
  margin-top:8px;
  text-align:center;
}

/* RESPONSIVE */
@media (max-width:600px){
  body{
    padding:80px 15px 15px;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
  }

  .header h1{
    font-size:20px;
  }

  .nav-btn{
    font-size:13px;
    padding:6px 10px;
  }

  .card{
    padding:18px;
    border-radius:18px;
    max-width:100%;
  }

  input, select{
    padding:10px 12px;
    font-size:13px;
  }

  .btn{
    padding:10px;
    font-size:14px;
  }
}

/* MOBILE RESPONSIVE FIX FOR PROFILE.HTML */
@media (max-width: 768px) {
  body {
    /* Mobile ma upar thi 100px jagya nathi rakhvi, karan ke header have fixed nathi */
    padding: 20px 15px !important;
  }

  .header {
    position: relative; /* Header ne fixed mathi kadhi nakhyu */
    top: 0;
    left: 0;
    width: 100%;
    flex-direction: column; /* Naam ane menu niche aavi jay */
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
  }

  .header h1 {
    font-size: 26px; /* Title thodu motu rakhyu mobile ma saru lage */
  }

  .nav-right {
    justify-content: center; /* Badha buttons vache (center) aavi jay */
    width: 100%;
  }

  .card {
    margin-top: 0;
    padding: 20px;
    width: 100%;
  }
  
  /* Inputs ane buttons thoda mota rakhya touch karva mate */
  input, select, .btn {
    padding: 14px;
    font-size: 16px;
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>Profile</h1>
  <div class="nav-right">
    <a href="index.html" class="nav-btn">Dashboard</a>
    <a href="food.html" class="nav-btn">Food</a>
    <a href="routine.html" class="nav-btn">Routine</a>
    <a href="cart.html" class="nav-btn">Cart</a>
    <a href="#" class="nav-btn logout" onclick="logout()">Logout</a>
  </div>
</div>

<!-- USER INFO -->
<div class="card">
  <h3>User Info</h3>
  <label>Name</label>
  <input id="username">
  <label>Age</label>
  <input type="number" id="age">
  <label>Weight (kg)</label>
  <input type="number" id="weight">
  <label>Height (cm)</label>
  <input type="number" id="height">
</div>

<!-- GOALS -->
<div class="card">
  <h3>Goals</h3>
  <label>Goal Type</label>
  <select id="goalType">
    <option value="weightLoss">Weight Loss</option>
    <option value="maintain">Maintain Weight</option>
    <option value="muscleGain">Muscle Gain</option>
  </select>
  <label>Daily Calorie Goal</label>
  <input type="number" id="dailyCal">
</div>

<!-- SAVE -->
<div class="card">
  <button class="btn" onclick="saveProfileData()">Save Profile</button>
  <p class="small">Saved locally in your browser</p>
</div>

<script>
if(localStorage.getItem("loggedIn")!=="true"){
  window.location.href="login.html";
}

function logout(){
  localStorage.removeItem("loggedIn");
  window.location.href="login.html";
}

const profile=JSON.parse(localStorage.getItem("profileData"))||{};

function loadProfileData(){
  username.value=profile.username||"";
  age.value=profile.age||"";
  weight.value=profile.weight||"";
  height.value=profile.height||"";
  goalType.value=profile.goalType||"maintain";
  dailyCal.value=profile.dailyCal||"";
}

function saveProfileData(){
  localStorage.setItem("profileData",JSON.stringify({
    username:username.value,
    age:age.value,
    weight:weight.value,
    height:height.value,
    goalType:goalType.value,
    dailyCal:dailyCal.value
  }));
  alert("Profile saved ✔");
}

loadProfileData();
</script>

</body>
</html>
