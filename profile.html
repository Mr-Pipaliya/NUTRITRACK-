<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — NutriTrack+</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 24px;
      color: #070E1F; font-size: 32px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px var(--primary-glow);
      background-size: cover; background-position: center;
    }
    .profile-name { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
    .profile-email { font-size: 14px; color: var(--text3); }
    
    .bmi-card { text-align: center; }
    .bmi-val { font-size: 48px; font-weight: 900; line-height: 1; margin: 16px 0 8px; }
    .bmi-status { font-size: 14px; font-weight: 700; padding: 4px 12px; border-radius: var(--r-pill); display: inline-block; }
    .bmi-track { height: 8px; background: var(--surface2); border-radius: 4px; margin-top: 24px; position: relative; overflow: hidden; }
    .bmi-gradient { position: absolute; inset: 0; background: linear-gradient(90deg, #00D4FF 0%, #00F5A0 40%, #FFB347 70%, #FF4D6D 100%); }
    .bmi-marker { position: absolute; top: 0; bottom: 0; width: 4px; background: #070E1F; border-radius: 2px; transition: left 1s ease; left: 0%; box-shadow: 0 0 0 2px var(--bg2); }
    
    .settings-list { display: flex; flex-direction: column; gap: 12px; }
    .setting-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px; background: var(--surface); border-radius: var(--r-md);
      transition: 0.2s; cursor: pointer;
    }
    .setting-item:hover { background: var(--surface2); }
    .setting-info { display: flex; align-items: center; gap: 16px; font-weight: 600; }
    .setting-icon { width: 32px; height: 32px; border-radius: 10px; background: var(--bg2); display: flex; align-items: center; justify-content: center; color: var(--text2); }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="navbar">
    <div class="container" style="max-width: 800px;">
      <a href="dashboard.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px;">
        <div class="logo-icon"><i class="fas fa-leaf"></i></div>
        <span class="logo-text" style="font-size: 16px;">NutriTrack+</span>
      </a>
      <div class="nav-links">
        <a href="dashboard.html"><i class="fas fa-home"></i><span class="nav-text">Home</span></a>
        <a href="food.html"><i class="fas fa-book-open"></i><span class="nav-text">Food</span></a>
        <a href="routine.html"><i class="fas fa-check-square"></i><span class="nav-text">Routine</span></a>
        <a href="about.html"><i class="fas fa-info-circle"></i><span class="nav-text">About</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="nav-text">Cart</span></a>
        <a href="profile.html" class="active"><i class="fas fa-user"></i><span class="nav-text">Profile</span></a>
      </div>
    </div>
  </nav>

  <main class="app-container" style="padding-top: 24px;">
    
    <div class="profile-header" style="position: relative;">
      <div class="profile-avatar" id="avatarInitials" style="cursor: pointer;" onclick="openModal('editProfileModal')">NU</div>
      <button class="btn btn-primary" style="position: absolute; left: 60px; top: 60px; width: 32px; height: 32px; border-radius: 16px; padding: 0; font-size: 12px; border: 2px solid var(--bg);" onclick="openModal('editProfileModal')">
        <i class="fas fa-camera"></i>
      </button>
      <div>
        <h1 class="profile-name" id="profName" style="cursor: pointer;" onclick="openModal('editProfileModal')">Loading...</h1>
        <p class="profile-email" id="profEmail">user@example.com</p>
      </div>
    </div>

    <div class="card bmi-card">
      <h3 class="card-title">Your BMI</h3>
      <div class="bmi-val text-gradient" id="bmiValue">--.-</div>
      <div class="bmi-status" id="bmiStatus" style="background: rgba(0, 245, 160, 0.15); color: var(--primary);">Healthy Weight</div>
      
      <div class="bmi-track">
        <div class="bmi-gradient"></div>
        <div class="bmi-marker" id="bmiMarker"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); font-weight: 700; margin-top: 8px;">
        <span>15.0</span>
        <span>25.0</span>
        <span>40.0+</span>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Goals & Stats</h3>
      <form id="profileForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label">Weight (kg)</label>
            <input type="number" id="profWeight" class="form-input" step="0.1" required>
          </div>
          <div class="form-group">
            <label class="form-label">Height (cm)</label>
            <input type="number" id="profHeight" class="form-input" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Daily Calorie Goal</label>
          <input type="number" id="profCal" class="form-input" required>
        </div>
        <button type="submit" id="saveProfBtn" class="btn btn-primary btn-full">Save Changes</button>
      </form>
    </div>

    <div class="card">
      <h3 class="card-title">Account</h3>
      <div class="settings-list">
        <div class="setting-item" onclick="window.location.href='orders.html'">
          <div class="setting-info">
            <div class="setting-icon"><i class="fas fa-box"></i></div>
            My Orders
          </div>
          <i class="fas fa-chevron-right text3"></i>
        </div>
        <div class="setting-item" onclick="toggleDarkMode()">
          <div class="setting-info">
            <div class="setting-icon"><i class="theme-icon fas fa-moon"></i></div>
            Dark Mode
          </div>
          <i class="fas fa-chevron-right text3"></i>
        </div>
        <div class="setting-item" id="logoutBtn" style="color: var(--danger);">
          <div class="setting-info">
            <div class="setting-icon" style="color: var(--danger);"><i class="fas fa-sign-out-alt"></i></div>
            Log Out
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="editProfileModal">
    <div class="modal">
      <div class="modal-header">
        <h3 style="font-weight: 800;">Edit Profile</h3>
        <button class="modal-close" onclick="closeModal('editProfileModal')"><i class="fas fa-times"></i></button>
      </div>
      <form id="editProfileForm" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group" style="text-align: center; margin-bottom: 0;">
          <label class="form-label">Profile Photo</label>
          <div style="width: 100px; height: 100px; border-radius: 30px; background: var(--surface2); margin: 0 auto; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; border: 2px dashed var(--border); cursor: pointer;" onclick="document.getElementById('photoUpload').click()">
            <img id="photoPreview" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <i class="fas fa-image" id="photoIcon" style="font-size: 32px; color: var(--text3);"></i>
          </div>
          <input type="file" id="photoUpload" accept="image/*" style="display: none;" onchange="previewPhoto(event)">
          <p style="font-size: 12px; color: var(--text3); margin-top: 8px;">Click to upload</p>
        </div>
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="modalProfName" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Save Profile</button>
      </form>
    </div>
  </div>



  <script src="js/local-db.js"></script>
  <script src="js/script.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
