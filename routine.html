<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine — NutriTrack+</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .routine-list { display: flex; flex-direction: column; gap: 12px; }
    .routine-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); padding: 16px; border-radius: var(--r-md);
      border: 1px solid var(--border); transition: 0.2s; cursor: pointer;
    }
    .routine-item:hover { border-color: var(--primary); }
    .routine-item.done { background: rgba(0, 245, 160, 0.1); border-color: var(--primary); }
    .routine-info { display: flex; align-items: center; gap: 16px; }
    .routine-icon {
      width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; background: var(--bg2); color: var(--text3); transition: 0.2s;
    }
    .routine-item.done .routine-icon { background: var(--primary); color: #070E1F; }
    .routine-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .routine-desc { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .routine-check { color: var(--text3); font-size: 20px; transition: 0.2s; }
    .routine-item.done .routine-check { color: var(--primary); }
    
    .notes-box { width: 100%; min-height: 120px; resize: vertical; margin-bottom: 0; }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="navbar">
    <div class="container" style="max-width: 800px;">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-leaf"></i></div>
        <span class="logo-text" style="font-size: 16px;">NutriTrack+</span>
      </div>
      <div class="nav-links">
        <a href="dashboard.html"><i class="fas fa-home"></i><span class="nav-text">Home</span></a>
        <a href="food.html"><i class="fas fa-book-open"></i><span class="nav-text">Food</span></a>
        <a href="routine.html" class="active"><i class="fas fa-check-square"></i><span class="nav-text">Routine</span></a>
        <a href="about.html"><i class="fas fa-info-circle"></i><span class="nav-text">About</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="nav-text">Cart</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span class="nav-text">Profile</span></a>
        <button class="theme-toggle" style="width: 36px; height: 36px; border-radius: 12px; background: var(--surface); color: var(--text2); margin-left: 8px;"><i class="theme-icon fas fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <main class="app-container">
    <header class="page-header">
      <div>
        <h1>Daily Habits</h1>
        <p>Check off your daily health routine</p>
      </div>
    </header>

    <div class="card">
      <h3 class="card-title">Checklist</h3>
      <div class="routine-list" id="routineList">
        <!-- JS fills items -->
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Daily Notes</h3>
      <textarea id="routineNotes" class="form-input notes-box" placeholder="How are you feeling today? Any specific meals or workouts?"></textarea>
      <button id="saveNotesBtn" class="btn btn-primary" style="margin-top: 12px; width: 100%;">Save Notes</button>
    </div>

  </main>



  <script src="js/local-db.js"></script>
  <script src="js/script.js"></script>
  <script src="js/routine.js"></script>
</body>
</html>
