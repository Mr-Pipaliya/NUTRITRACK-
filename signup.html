<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — NutriTrack+</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; position: relative; overflow: hidden; }
    .auth-bg { position: absolute; inset: 0; z-index: -1; }
    .auth-orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.15; }
    .auth-card {
      width: 100%; max-width: 480px; background: rgba(var(--bg2-rgb), 0.8);
      backdrop-filter: blur(24px); border: 1px solid var(--border);
      border-radius: var(--r-xl); padding: 40px; box-shadow: var(--shadow);
      animation: fadeSlideUp 0.5s ease;
    }
    .auth-header { text-align: center; margin-bottom: 32px; }
    .auth-logo {
      width: 64px; height: 64px; border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #070E1F; font-size: 32px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; box-shadow: 0 8px 24px var(--primary-glow);
    }
    .auth-title { font-size: 28px; font-weight: 900; }
    .auth-subtitle { font-size: 14px; color: var(--text3); margin-top: 8px; }
    
    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: 12px; color: var(--text3); }
    
    .error-msg { background: rgba(255, 77, 109, 0.1); color: var(--danger); padding: 12px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; margin-bottom: 20px; display: none; }
    
    .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); transition: 0.3s; }
    .step-dot.active { background: var(--primary); width: 24px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-bg">
      <div class="auth-orb" style="width: 400px; height: 400px; top: -100px; left: -100px; background: var(--primary);"></div>
      <div class="auth-orb" style="width: 300px; height: 300px; bottom: -50px; right: -50px; background: var(--secondary);"></div>
    </div>
    
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo"><i class="fas fa-leaf"></i></div>
        <h1 class="auth-title text-gradient">Create Account</h1>
        <p class="auth-subtitle">Start your health journey today</p>
      </div>
      
      <div id="signupError" class="error-msg"><i class="fas fa-exclamation-circle"></i> <span id="signupErrorText"></span></div>
      
      <!-- Step 1: Auth -->
      <div id="step1">
        <form id="signupForm">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <i class="fas fa-user form-icon"></i>
            <input type="text" id="name" class="form-input has-icon" placeholder="Hardik Shah" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <i class="fas fa-envelope form-icon"></i>
            <input type="email" id="email" class="form-input has-icon" placeholder="hardik@gmail.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <i class="fas fa-lock form-icon"></i>
            <input type="password" id="password" class="form-input has-icon" placeholder="Min. 6 characters" minlength="6" required>
          </div>
          
          <button type="submit" id="signupBtn" class="btn btn-primary btn-full"><i class="fas fa-user-plus"></i> Create Account</button>
        </form>
        
        <div class="divider"><span>OR</span></div>
        
        <button id="googleSignupBtn" class="btn btn-outline btn-full">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 18px; margin-right: 8px;">
          Sign up with Google
        </button>
      </div>

      <!-- Step 2: Onboarding (Hidden initially) -->
      <div id="step2" class="hide">
        <div class="step-indicator">
          <div class="step-dot"></div>
          <div class="step-dot active"></div>
        </div>
        <p style="text-align: center; margin-bottom: 20px; font-weight: 600;">Tell us about yourself so we can personalize your goals.</p>
        
        <form id="onboardingForm">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="age">Age</label>
              <input type="number" id="age" class="form-input" placeholder="25" min="10" max="100" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="gender">Gender</label>
              <select id="gender" class="form-input" required>
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="weight">Weight (kg)</label>
              <input type="number" id="weight" class="form-input" placeholder="70" step="0.1" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="height">Height (cm)</label>
              <input type="number" id="height" class="form-input" placeholder="170" required>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="goal">Fitness Goal</label>
            <select id="goal" class="form-input" required>
              <option value="maintain">Maintain Weight</option>
              <option value="weightLoss">Lose Weight</option>
              <option value="muscleGain">Build Muscle</option>
            </select>
          </div>
          
          <button type="submit" id="completeBtn" class="btn btn-primary btn-full"><i class="fas fa-check"></i> Complete Setup</button>
        </form>
      </div>
      
      <p id="loginLink" style="text-align: center; margin-top: 32px; font-size: 13px; color: var(--text3);">
        Already have an account? <a href="login.html" class="text-gradient" style="font-weight: 700;">Log In</a>
      </p>
    </div>
  </div>

  <script src="js/local-db.js"></script>
  <script src="js/script.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
