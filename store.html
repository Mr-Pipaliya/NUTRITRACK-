<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Store — NutriTrack+</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-top: 24px; }
    .product-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-sm); transition: 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--primary); }
    .product-img { width: 100%; height: 140px; background: var(--surface); object-fit: cover; }
    .product-info { padding: 16px; }
    .product-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .product-price { font-size: 16px; font-weight: 900; color: var(--primary); margin-bottom: 12px; }
    
    .cart-badge { position: relative; display: inline-flex; }
    .cart-count { position: absolute; top: -6px; right: -8px; background: var(--primary); color: #070E1F; font-size: 10px; font-weight: 800; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="navbar">
    <div class="container" style="max-width: 800px;">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-leaf"></i></div>
        <span class="logo-text" style="font-size: 16px;">NutriTrack+</span>
      </div>
      <div class="nav-links">
        <a href="dashboard.html"><i class="fas fa-home"></i><span class="nav-text">Home</span></a>
        <a href="food.html"><i class="fas fa-book-open"></i><span class="nav-text">Food</span></a>
        <a href="routine.html"><i class="fas fa-check-square"></i><span class="nav-text">Routine</span></a>
        <a href="about.html" class="active"><i class="fas fa-info-circle"></i><span class="nav-text">About</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="nav-text">Cart</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span class="nav-text">Profile</span></a>
        <button class="theme-toggle" style="width: 36px; height: 36px; border-radius: 12px; background: var(--surface); color: var(--text2); margin-left: 8px;"><i class="theme-icon fas fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <main class="app-container">
    <header class="page-header" style="margin-bottom: 12px;">
      <div>
        <h1>NutriShop</h1>
        <p>Premium fermented foods and supplements</p>
      </div>
      <a href="orders.html" class="btn btn-outline" style="padding: 8px 12px; font-size: 12px;"><i class="fas fa-box"></i> My Orders</a>
    </header>

    <div class="store-grid" id="productsGrid">
      <div style="text-align: center; grid-column: 1/-1; padding: 40px; color: var(--text3);">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 12px;">Loading products...</p>
      </div>
    </div>
  </main>

  <script src="js/local-db.js"></script>
  <script src="js/script.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
